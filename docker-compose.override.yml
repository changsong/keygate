# Local-only: port 9000 is occupied by an existing stack on this host.
services:
  keygate:
    ports: !override
      - "19000:9000"
    environment:
      BASE_URL: http://localhost:19000
      # Local stack: Casdoor runs on plain HTTP (published on :8000).
      # Production keeps the HTTPS-only validation from the base compose.
      ENVIRONMENT: development
    extra_hosts:
      - "host.docker.internal:host-gateway"

  casdoor:
    image: casbin/casdoor-all-in-one:latest
    ports:
      - "8000:8000"
    environment:
      driverName: sqlite
      dataSourceName: "file:/data/casdoor.db?cache=shared&_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
      # One-time bootstrap for a fresh volume; change it after first login.
      initAdminPassword: KeygateAdmin123
      origin: http://host.docker.internal:8000
    volumes:
      - casdoor_data:/data
    restart: unless-stopped

volumes:
  casdoor_data:
