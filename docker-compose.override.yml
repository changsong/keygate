# Local-only: port 9000 is occupied by an existing stack on this host.
services:
  keygate:
    ports: !override
      - "19000:9000"
    environment:
      BASE_URL: http://localhost:19000
      # Local stack: Casdoor runs on plain HTTP (published on :8000).
      # Production keeps the HTTPS-only validation from the base compose.
      ENVIRONMENT: development
    extra_hosts:
      - "host.docker.internal:host-gateway"

  casdoor:
    image: casbin/casdoor-all-in-one:latest
    # The all-in-one image's entrypoint execs /server without the flag that
    # creates the postgres database, which then fails on a fresh instance.
    entrypoint: ["/server"]
    command: ["--createDatabase=true"]
    ports:
      - "8000:8000"
    environment:
      driverName: postgres
      # Shares the bundled postgres service, in its own casdoor database.
      dataSourceName: "user=keygate password=keygate host=postgres port=5432 sslmode=disable dbname=casdoor"
      # One-time bootstrap for a fresh database; change it after first login.
      initAdminPassword: KeygateAdmin123
      origin: http://host.docker.internal:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
